name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
      MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # 版本取 csproj 里的 <Version>；tag 只用于 Release 名称
      - name: Build portable zip + MSIX + installer
        shell: pwsh
        run: ./packaging/build-release.ps1

      - name: Sign MSIX (optional)
        if: env.MSIX_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Select-Object -Last 1 -ExpandProperty FullName
          Get-ChildItem dist\*.msix | ForEach-Object {
            & $signtool sign /fd SHA256 /f $pfx /p $env:MSIX_PFX_PASSWORD $_.FullName
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluent-zones-release
          path: |
            dist/*.zip
            dist/*.msix
            dist/*Setup*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.msix
            dist/*Setup*.exe
          generate_release_notes: true
